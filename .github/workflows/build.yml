name: Build & Release (Windows)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["src-tauri/**", "ui/**", ".github/workflows/build.yml"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Generate app icons
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/icons/icon.ico")) {
            npx @tauri-apps/cli icon assets/icon.png
          }

      - name: Build (Tauri)
        run: npm run tauri build

      - name: Sign binaries (if certificate secrets are configured)
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: \${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: \${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_PFX_BASE64) {
            Write-Host "::warning::Aucun certificat configure (secrets WINDOWS_PFX_BASE64 / WINDOWS_PFX_PASSWORD). Binaires non signes."
            exit 0
          }
          $bytes = [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64)
          [IO.File]::WriteAllBytes("$PWD\cert.pfx", $bytes)
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "x64" } | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "signtool: $signtool"
          $targets = Get-ChildItem "src-tauri\target\release" -Filter *.exe
          $bundles = Get-ChildItem "src-tauri\target\release\bundle\nsis" -Filter *.exe -ErrorAction SilentlyContinue
          foreach ($f in @($targets) + @($bundles)) {
            & $signtool sign /fd SHA256 /f cert.pfx /p "$env:WINDOWS_PFX_PASSWORD" /tr http://timestamp.digicert.com /td SHA256 $f.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Remove-Item cert.pfx
          Write-Host "Signature OK."

      - name: Compute SHA256
        shell: pwsh
        run: |
          Get-ChildItem "src-tauri\target\release\bundle\nsis" -Filter *.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$h  $($_.Name)" | Out-File -Append SHA256SUMS.txt
          }
          Get-ChildItem "src-tauri\target\release" -Filter "aurora-player.exe" | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$h  $($_.Name)" | Out-File -Append SHA256SUMS.txt
          }
          Get-Content SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurora-player-windows
          path: |
            src-tauri/target/release/aurora-player.exe
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/aurora-player.exe
            SHA256SUMS.txt
