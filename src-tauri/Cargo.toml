[package]
name = "aurora-player"
version = "0.1.0"
description = "Lecteur de musique Windows 11 au design adaptatif"
authors = ["Chariow Business"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
lofty = "0.21"
dirs = "5"
base64 = "0.22"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
